<div
  class="newsline-container"
  (click)="openNewsModal()"
  role="button"
  tabindex="0"
  aria-label="Noticias"
  aria-haspopup="dialog"
  (keydown.enter)="openNewsModal()"
  (keydown.space)="$event.preventDefault(); openNewsModal()"
>
  <div class="opacity-overlay" aria-hidden="true">
    <div class="newsline-content">
      @for (item of displayItems(); track $index) {
        <span>{{ item }}</span>
        <span class="separator"> • </span>
      }
    </div>
  </div>
</div>
