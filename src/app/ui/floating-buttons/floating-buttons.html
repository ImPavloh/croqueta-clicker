<div class="floating-buttons">
  <button class="floating-btn upgrades-btn" (click)="openUpgrades()" title="Mejoras">
    <img
      class="btn-icon"
      src="/assets/icons/upgrade.webp"
      alt="Mejoras"
      loading="lazy"
      decoding="async"
    />
  </button>
  <button class="floating-btn achievements-btn" (click)="openAchievements()" title="Logros">
    <img
      class="btn-icon"
      src="/assets/icons/trophy.webp"
      alt="Logros"
      loading="lazy"
      decoding="async"
    />
  </button>
  <button class="floating-btn skins-btn" (click)="openSkins()" title="Skins">
    <img
      class="btn-icon"
      src="/assets/icons/palette.webp"
      alt="Skins"
      loading="lazy"
      decoding="async"
    />
  </button>
  <button class="floating-btn options-btn" (click)="openOptions()" title="Opciones">
    <img
      class="btn-icon"
      src="/assets/icons/settings.webp"
      alt="Opciones"
      loading="lazy"
      decoding="async"
    />
  </button>
  <button class="floating-btn contracts-btn" (click)="openContracts()" title="Contratos diarios">
    <span class="btn-icon-text">📜</span>
  </button>
  @if (timeService.isCroquetaDay()) {
    <button
      class="floating-btn croqueta-day-btn"
      (click)="modalService.openModal('event-info')"
      title="¡Día de la Croqueta!"
    >
      <div class="croqueta-day-glow-mobile"></div>
      <img
        class="btn-icon croqueta-icon"
        src="/assets/skins/croqueta-dorada.webp"
        alt="Event"
        loading="lazy"
        decoding="async"
      />
      <span class="mobile-multiplier-badge">x3</span>
    </button>
  }
</div>
